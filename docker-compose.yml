services:

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: Test@123
      MYSQL_DATABASE: bankappdb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bank-network

  bank-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: Test@123
      MYSQL_DATABASE: bankappdb
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8080:8080"
    networks:
      - bank-network

  ollama:
    image: alpine/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local

