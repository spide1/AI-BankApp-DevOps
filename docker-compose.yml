services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Test@123
      MYSQL_DATABASE: bankappdb

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pTest@123",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mysql_network

  bank-app:
    build:
      context: .
    container_name: bank-app
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306  
      MYSQL_USER: root
      MYSQL_PASSWORD: Test@123
      MYSQL_DATABASE: bankappdb
    depends_on:
      mysql:
        condition: service_healthy     
    ports:
      - "8080:8080"
    networks:
      - mysql_network

networks:
  mysql_network:
    driver: bridge
volumes:
  mysql_data:


